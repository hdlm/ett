[versions]
# Build Tools & Core
agp = "9.0.1"
kotlin = "2.3.21"
ksp = "2.3.4"
coreKtx = "1.18.0"
lifecycleVersion = "2.10.0"
activityCompose = "1.13.0"
composeBom = "2026.05.00"
navigationCompose = "2.9.8"
constraintLayoutCompose = "1.1.1"

# DI & Persistence
koinVersion = "4.2.1"
roomVersion = "2.8.4"
datastoreVersion = "1.2.1"

# Background & Media
workVersion = "2.11.2"
coilVersion = "2.7.0"
pagingVersion = "3.5.0"

# UI Extra & Utils
timberVersion = "5.0.1"
zxingVersion = "4.3.0"
pagerVersion = "0.36.0"
systemuicontrollerVersion = "0.36.0"
numberpickerCompose = "1.0.3"
easycropVersion = "0.1.1"

# Async
coroutinesVersion = "1.11.0"

# Testing
junit = "4.13.2"
junitX = "1.3.0"
espressoCore = "3.7.0"
mockkVersion = "1.14.9"
testRunnerVersion = "1.7.0"
testRulesVersion = "1.7.0"
robolectricVersion = "4.16.1"

[libraries]
# AndroidX & Compose Core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleVersion" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleVersion" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleVersion" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-constraint-layout-compose = { group = "androidx.constraintlayout", name = "constraintlayout-compose", version.ref = "constraintLayoutCompose" }

# Dependency Injection (Koin)
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koinVersion" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koinVersion" }
koin-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koinVersion" }
koin-test-junit = { group = "io.insert-koin", name = "koin-test-junit4", version.ref = "koinVersion" }

# Persistence (Room, Datastore)
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "roomVersion" }
room-compiler-ksp = { group = "androidx.room", name = "room-compiler", version.ref = "roomVersion" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "roomVersion" }
room-test = { group = "androidx.room", name = "room-testing", version.ref = "roomVersion" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastoreVersion" }

# WorkManager
workmanager = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workVersion" }
workmanager-test = { group = "androidx.work", name = "work-testing", version.ref = "workVersion" }

# Media & Pagination
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coilVersion" }
coil-svg = { group = "io.coil-kt", name = "coil-svg", version.ref = "coilVersion" }
paging = { group = "androidx.paging", name = "paging-runtime", version.ref = "pagingVersion" }
paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "pagingVersion" }
paging-test = { group = "androidx.paging", name = "paging-common", version.ref = "pagingVersion" }

# Utils & UI Extras
timber-log = { group = "com.jakewharton.timber", name = "timber", version.ref = "timberVersion" }
barcode-zxing-android = { group = "com.journeyapps", name = "zxing-android-embedded", version.ref = "zxingVersion" }
pager = { group = "com.google.accompanist", name = "accompanist-pager", version.ref = "pagerVersion" }
pager-indicators = { group = "com.google.accompanist", name = "accompanist-pager-indicators", version.ref = "pagerVersion" }
systemuicontroller-compose = { group = "com.google.accompanist", name = "accompanist-systemuicontroller", version.ref = "systemuicontrollerVersion" }
numberpicker-compose = { group = "com.chargemap.compose", name = "numberpicker", version.ref = "numberpickerCompose" }
image-cropper = { group = "io.github.mr0xf00", name = "easycrop", version.ref = "easycropVersion" }

# Coroutines
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutinesVersion" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutinesVersion" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesVersion" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitX" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
mockk-test = { group = "io.mockk", name = "mockk", version.ref = "mockkVersion" }
robolectric-test = { group = "org.robolectric", name = "robolectric", version.ref = "robolectricVersion" }
androidx-junit-runner = { group = "androidx.test", name = "runner", version.ref = "testRunnerVersion" }
androidx-junit-rules = { group = "androidx.test", name = "rules", version.ref = "testRulesVersion" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

[bundles]
androidx-compose-full = [
    "androidx-core-ktx",
    "androidx-activity-compose",
    "androidx-lifecycle-runtime-ktx",
    "androidx-lifecycle-runtime-compose",
    "androidx-lifecycle-viewmodel-compose",
    "androidx-compose-foundation",
    "androidx-ui",
    "androidx-ui-graphics",
    "androidx-ui-tooling-preview",
    "androidx-material3",
    "androidx-material-icons-core",
    "androidx-material-icons-extended",
    "androidx-navigation-compose",
    "androidx-constraint-layout-compose"
]
koin = [ "koin-core", "koin-android", "koin-compose" ]
coil = [ "coil-compose", "coil-svg" ]
paging = [ "paging", "paging-compose" ]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp-kotlin = { id = "com.google.devtools.ksp", version.ref = "ksp" }
